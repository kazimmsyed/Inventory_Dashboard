<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css_k/bootstrap.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
  <script src="{{ url_for('static', path='js_k/bootstrap.bundle.js') }}" defer></script>
  <style>
      #register_sec{
        width: 40%;
        margin:auto;
        border:0px solid black;
      }
      #login_company_div img{
            width:50%;
            height:20%;
        }
  </style>
</head>
<body>

  <section id="register_sec">
    <form class="row g-3">
      <div class="col-12 " >
        <div id="login_company_div" class="d-flex justify-content-center">
        <img src="{{url_for('static',path='/images/northwind.png') }}">
          </div>
      </div>


      <div class="col-md-6">
    <label for="validationDefault01" class="form-label">First name</label>
    <input type="text" class="form-control" id="validationDefault01" value="Mark" required>
    </div>
    <div class="col-md-6">
    <label for="validationDefault02" class="form-label">Last name</label>
    <input type="text" class="form-control" id="validationDefault02" value="Otto" required>
    </div>

    <div class="col-12">
    <label for="validationServerUsername" class="form-label">Username</label>
    <div class="input-group has-validation">
      <span class="input-group-text" id="inputGroupPrepend3">@</span>
      <input type="text" class="form-control is-invalid" id="validationServerUsername" aria-describedby="inputGroupPrepend3 validationServerUsernameFeedback" required>
      <div id="validationServerUsernameFeedback" class="invalid-feedback">
        Please choose a username.
      </div>
    </div>
  </div>

      <div class="col-12">
          <label for="exampleInputEmail1" class="form-label">Email address</label>
          <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
          <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
      </div>

      <div class="col-12">
          <label for="exampleInputPassword1" class="form-label">Password</label>
          <input type="password" class="form-control" id="exampleInputPassword1">
      </div>

     <div>
       <div class="card-body">
        <a class="card-title" href="/auth/login">Already have an Account? Login</a>
        </div>
     </div>

    <div class="d-flex justify-content-center">
    <button type="submit" class="btn btn-primary">Submit</button>
    </div>







      </form>


  </section>
</body>
</html>
