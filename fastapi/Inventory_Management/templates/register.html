{% extends "partials/layout.html" %}
{% block style_block %}
<link type="text/css" rel="stylesheet" href="{{url_for('static',path='/css/register.css') }}" \>
<style>
    draw-border{
        border:1px solid black;
    }
}
</style>

{% endblock %}




{% block content %}
  <section id="register_sec">
    <form id='register_form' class="row g-3">
      <div class="col-12 " >
        <div id="login_company_div" class="d-flex justify-content-center">
        <img src="{{url_for('static',path='/images/northwind.png') }}">
          </div>
      </div>


      <div class="col-md-6">
    <label for="first_name" class="form-label">First name</label>
    <input type="text" class="form-control" id="first_name" value="River" required>
    </div>
    <div class="col-md-6">
    <label for="last_name" class="form-label">Last name</label>
    <input type="text" class="form-control" id="last_name" value="Wind" required>
    </div>

    <div class="col-md-12">
    <label for="validationServerUsername" class="form-label">Username</label>
    <div class="input-group has-validation">
      <span class="input-group-text" id="inputGroupPrepend3">@</span>
      <input type="text" class="form-control is-invalid" value="sahil" id="validationServerUsername" aria-describedby="inputGroupPrepend3 validationServerUsernameFeedback" required>
      <div id="validationServerUsernameFeedback" class="invalid-feedback">
        Please choose a username.
      </div>
    </div>
  </div>

      <div class="col-12">
          <label for="exampleInputEmail1" class="form-label">Email address</label>
          <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
          value="sahilsyed@gmail.com"
          >
          <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
      </div>

      <div class="col-12">
          <label for="exampleInputPassword1" class="form-label">Password</label>
          <input type="password"  class="form-control" id="exampleInputPassword1" value="sahil123">
      </div>

        <div class="col-12">
          <label for="exampleInputPassword2" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="exampleInputPassword2" value="sahil123">
            <div id="password_not_matched2" class="invalid-feedback">
           Passwords do not match
        </div>
      </div>

     <div>
       <div class="card-body">
        <a class="card-title" href="/auth/login">Already have an Account? Login</a>
        </div>
     </div>

    <div class="d-flex justify-content-center">
    <button type="submit" class="btn btn-primary">Submit</button>
    </div>







      </form>


  </section>

{% endblock %}

{% block js_block %}
<script src="{{url_for('static',path='js/registeration.js') }}"  defer></script>
<script src="{{url_for('static',path='js/register_validation.js') }}" defer></script>

{% endblock %}
