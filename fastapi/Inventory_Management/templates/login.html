<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Northwind</title>
    <link type="text/css" rel="stylesheet" href="{{url_for('static',path='/css/base.css') }}" \>
    <link type="text/css" rel="stylesheet" href="{{url_for('static',path='/css_k/bootstrap.css') }}" \>
    <script src="/js_k/bootstrap.bundle.js"></script>
    <style>
        #login_sec{
            margin-top:3rem;
        }

        #login_main_div{
            border:0px solid wheat;

            height:100%;
            display: flex;
            z-index: -2;
            justify-content: center;
            position: relative;
        }

        #login_main_div::before{
            content:"";
            border:1rem solid gold;
            z-index:-1;
            top:15%;
            left:15%;
            width: 50%;
            height: 100%;
            position: absolute;

        }

        #login_main_div::after{
            content:"";
            background-color: gold;
            z-index:-1;
            top:-15%;
            right:95%;
            width: 10%;
            height: 50%;
            position: absolute;
        }


        #login_main_div img{

            height:100%;
            width: 60%;

        }

        #login_form{
            padding-top:1rem;

        }
        #login_form div{
            padding-top:0.8rem;

        }
        #login_company_div{
            border:0px solid grey;
            display: flex;
            flex-direction: row;
            justify-content: center;

        }
        #login_company_div img{
            width:50%;
            height:20%;
        }
    </style>
</head>
<body>

<section class="container" style="height:80vh;border:0px solid black" id="login_sec">
    <div class="row" >
        <div class="col">

            <div id="login_main_div">
                <img src="https://plus.unsplash.com/premium_photo-1661879449050-069f67e200bd?q=80&w=1644&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt="cargo_overseas">

            </div>

        </div>
        <div class="col-4" style="border:0px solid black">
                <form id="login_form" style="border:0px solid green; height:60vh">
                    <div class="mb-3">
                        <div id="login_company_div">
                            <img src="{{url_for('static',path='/images/northwind.png') }}">
                        </div>

                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Password</label>
                        <input type="password" class="form-control" id="exampleInputPassword1">
                    </div>
                    <a href="/auth/register">Create an Account, Register?</a>
                    <br><br>
                    <button type="submit" class="btn btn-primary">Submit</button>

                </form>


        </div>

    </div>


</section>
    <figure class="text-center">
  <blockquote class="blockquote">
    <p>The Northwind database contains the sales data for a fictitious company called “Northwind Traders</p>
  </blockquote>
  <figcaption class="blockquote-footer">
    Someone famous in <cite title="Source Title">Source Title</cite>
  </figcaption>
</figure>
</body>
</html>
